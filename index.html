<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a110b">
<title>上班旅人 塔防</title>
<style>
@font-face { font-family: 'Noto Sans TC'; src: url(fonts/NotoSansTC.ttf); font-display: swap; }
html, body { margin: 0; height: 100%; background: #140d08; overflow: hidden; touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; touch-action: none; }
#boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #e6dcc2; font: 700 18px 'Noto Sans TC', sans-serif; letter-spacing: 2px; }
#rot { display: none; position: absolute; inset: 0; background: #140d08; color: #e6dcc2; font: 700 20px 'Noto Sans TC', sans-serif; align-items: center; justify-content: center; text-align: center; z-index: 9; }
@media (orientation: portrait) and (max-width: 900px) { #rot { display: flex; } }
img { -webkit-user-drag: none; }
</style>
</head>
<body>
<div id="boot">載入中 0%</div>
<div id="rot">請把手機轉成橫向</div>
<canvas id="c"></canvas>
<script type="module" src="js/main.js"></script>
</body>
</html>
